[project]
name = "gunauto-v1"
version = "0.1.0"
description = "Modular gun-video generation pipeline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
]

[project.optional-dependencies]
video = [
  "moviepy>=2.1,<3.0",
  "Pillow>=11.0,<12.0",
  "numpy>=2.0,<3.0",
]
ai = [
  "openai>=1.99,<2.0",
  "httpx>=0.28,<1.0",
]
dev = [
  "pytest>=8.4,<9.0",
  "ruff>=0.12,<1.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
